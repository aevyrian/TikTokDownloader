<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抖音 · 下载管理</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><header><div><span class="eyebrow">DOUYIN / PERSONAL LIBRARY</span><h1>下载管理</h1><p>把想保存的内容，安放在自己的资料库。</p></div><span id="connection" class="pill">等待连接</span></header>
<section class="access"><label>访问令牌 <input id="token" type="password" autocomplete="off" placeholder="填写数据目录 access-token 文件中的令牌"></label><button id="connect">连接后台</button></section>
<div id="message" role="status" aria-live="polite"></div>
<section class="card"><h2>添加下载</h2><p>支持完整作品链接、抖音分享文案、作品 ID 和用户主页。每次最多 500 条。</p><textarea id="links" rows="4" placeholder="在这里粘贴链接，多条内容可以一起提交" aria-label="下载链接"></textarea><div class="row"><span class="muted">自动识别重复作品 · 重启后继续队列</span><button id="submit" class="primary">加入队列 ↗</button></div></section>
<div id="stats" class="stats"></div>
<section class="card"><div class="row"><h2>下载任务</h2><label>筛选 <select id="filter"><option value="">全部</option><option value="queued">排队中</option><option value="running">下载中</option><option value="completed">已完成</option><option value="failed">失败</option><option value="retry_wait">等待重试</option><option value="skipped">已跳过</option></select></label></div><div id="tasks" aria-live="polite">连接后台后显示任务。</div><div class="row pagination"><button id="previous">上一页</button><span id="page">第 1 页</span><button id="next">下一页</button></div></section>
<details class="card"><summary>设置与历史导入</summary><form id="settings"><div class="settings"><label>并发任务<input id="workers" type="number" min="1" max="4" value="2"></label><label>自动重试<input id="retries" type="number" min="0" max="5" value="2"></label><label>主页最大页数<input id="max-pages" type="number" min="1" max="100" value="5"></label><label>分类<select id="category"><option value="author">按作者</option><option value="type">按视频 / 图集</option></select></label></div><label>抖音 Cookie <input id="cookie" type="password" autocomplete="off" placeholder="留空保留已有配置"></label><label><input id="clear-cookie" type="checkbox">清除已保存的 Cookie</label><p class="muted" id="cookie-state">Cookie 只存于本机数据目录，不会返回界面。</p><button type="submit">保存设置</button></form><hr><p>将旧数据库副本放到数据目录的 <code>legacy/DouK-Downloader.db</code>，再导入下载历史。不会修改旧文件。</p><button id="import">导入旧历史</button></details>
<footer>基于 DouK-Downloader · GPLv3 · 数据保存在你自己的设备</footer></main></body></html>
